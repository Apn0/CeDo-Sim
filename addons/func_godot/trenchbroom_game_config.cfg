[game]
name = "CeDo Simulator"
icon = "icon.png"
fileformats = [ "valve" ]
filesystem = {
    "searchpath": ".",
    "packageformat": { "extension": ".zip", "format": "zip" }
}
textures = {
    "package": { "type": "directory", "root": "assets/textures" },
    "format": { "extensions": [ "png", "jpg", "jpeg", "webp" ], "format": "image" },
    "palette": "palette.lmp",
    "attribute": "_tb_textures"
}
entities = {
    "definitions": [ "CeDo_Simulator.fgd" ],
    "default_color": "0.6 0.6 0.6 1.0"
}
tags = {
    "brush": [
        {
            "name": "Trigger",
            "attribs": [ "transparent" ],
            "match": "classname",
            "pattern": "trigger*"
        },
        {
            "name": "Wall",
            "attribs": [ "solid" ],
            "match": "classname",
            "pattern": "func_wall*"
        }
    ]
}
