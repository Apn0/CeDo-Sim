<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{margin:0;padding:0;background:#05070f;}
a{color:#7fb2e8;} a:hover{color:#a8ccf2;}
</style>
</helmet>
<div style="width:1920px;height:1080px;position:relative;overflow:hidden;background:linear-gradient(160deg,#141b33 0%,#0d1226 45%,#080b18 100%);font-family:Tahoma,Verdana,sans-serif;color:#e8ecf5;" data-screen-label="BluPort Overzicht Lijn 3C">

    <div style="font-size:24px;line-height:1.25;">0:00:00<br>01-01-2024</div>
  </div>
  <div style="position:absolute;top:26px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;">
    <span style="font-size:40px;font-weight:700;font-family:Georgia,serif;">R<span style="font-size:26px;vertical-align:-8px;">x</span></span>
    <span style="font-size:30px;">LDPE 800 kg/h 22.04.2024 IBN</span>

  <div style="position:absolute;top:28px;right:44px;display:flex;align-items:center;gap:22px;">

    <span style="font-size:38px;font-weight:700;font-style:italic;color:#3f8fd6;">BluPort<span style="font-size:16px;vertical-align:14px;">®</span></span>
    <span style="font-size:40px;font-weight:800;letter-spacing:1px;color:#e8ecf5;">EREMA</span>
    <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="#e8ecf5"></circle><path d="M9 20 Q17 8 25 15" fill="none" stroke="#0d1226" stroke-width="4"></path></svg>
  </div>

  <!-- left sidebar values -->
  <div style="position:absolute;top:110px;left:24px;width:270px;display:flex;flex-direction:column;font-size:28px;">
    <div style="display:flex;gap:16px;border-left:3px solid #aab2c8;padding:10px 0 18px 0;">
      <svg width="44" height="44" viewBox="0 0 44 44" style="flex:none;margin-top:6px;"><circle cx="22" cy="22" r="16" fill="none" stroke="#e8ecf5" stroke-width="2.5"></circle><path d="M14 28 L22 16 L30 24" fill="none" stroke="#e8ecf5" stroke-width="2.5"></path></svg>
      <div style="display:grid;grid-template-columns:110px auto;column-gap:14px;row-gap:12px;">
        <span style="text-align:right;">0</span><span>°C</span>
        <span style="text-align:right;">0,0</span><span>kW</span>
      </div>
    </div>
    <div style="display:flex;gap:16px;border-left:3px solid #aab2c8;padding:14px 0 18px 0;">
      <svg width="44" height="44" viewBox="0 0 44 44" style="flex:none;margin-top:10px;"><g fill="#e8ecf5"><circle cx="12" cy="14" r="2.5"></circle><circle cx="20" cy="14" r="2.5"></circle><circle cx="28" cy="14" r="2.5"></circle><circle cx="16" cy="22" r="2.5"></circle><circle cx="24" cy="22" r="2.5"></circle><circle cx="32" cy="22" r="2.5"></circle></g></svg>
      <div style="display:grid;grid-template-columns:110px auto;column-gap:14px;row-gap:12px;">
        <span style="text-align:right;">0</span><span>rpm</span>
        <span style="text-align:right;">0</span><span>%</span>
        <span style="text-align:right;">0</span><span>h</span>
      </div>
    </div>
    <div style="display:flex;gap:16px;border-left:3px solid #aab2c8;padding:14px 0 18px 0;">
      <svg width="44" height="44" viewBox="0 0 44 44" style="flex:none;"><g stroke="#e8ecf5" stroke-width="2.5" fill="none"><path d="M16 22 L10 22 M28 22 L34 22"></path><path d="M22 14 L30 22 L22 30 L14 22 Z"></path><circle cx="22" cy="22" r="2" fill="#e8ecf5"></circle></g></svg>
      <div style="display:grid;grid-template-columns:110px auto;column-gap:14px;">
        <span style="text-align:right;color:#ff7a2f;">0</span><span>bar</span>
      </div>
    </div>
    <div style="display:flex;gap:16px;border-left:3px solid #aab2c8;padding:14px 0 18px 0;">
      <svg width="44" height="44" viewBox="0 0 44 44" style="flex:none;"><g stroke="#e8ecf5" stroke-width="2.5" fill="none"><rect x="12" y="10" width="20" height="24" rx="3"></rect><line x1="17" y1="16" x2="27" y2="16"></line><line x1="17" y1="22" x2="27" y2="22"></line></g></svg>
      <div style="display:grid;grid-template-columns:110px auto;column-gap:14px;">
        <span style="text-align:right;">0</span><span>bar</span>
      </div>
    </div>
    <div style="display:flex;gap:16px;border-left:3px solid #aab2c8;padding:14px 0 18px 0;">
      <svg width="44" height="44" viewBox="0 0 44 44" style="flex:none;"><g stroke="#e8ecf5" stroke-width="2.5" fill="none"><path d="M16 22 L10 22 M28 22 L34 22"></path><path d="M22 14 L30 22 L22 30 L14 22 Z"></path><line x1="19" y1="22" x2="25" y2="22"></line></g></svg>
      <div style="display:grid;grid-template-columns:110px auto;column-gap:14px;">
        <span style="text-align:right;">0</span><span>bar</span>
      </div>
    </div>
    <div style="display:flex;gap:16px;border-left:3px solid #aab2c8;padding:14px 0 8px 0;">
      <svg width="44" height="44" viewBox="0 0 44 44" style="flex:none;"><g stroke="#e8ecf5" stroke-width="2.5" fill="none"><rect x="8" y="12" width="18" height="20" rx="2"></rect><path d="M26 22 L36 22 M31 17 L36 22 L31 27"></path></g></svg>
      <div style="display:flex;align-items:center;gap:14px;">
        <span style="width:110px;text-align:right;">0</span>
        <span style="display:inline-flex;flex-direction:column;align-items:center;font-size:22px;line-height:1.05;"><span>kg</span><span style="border-top:2px solid #e8ecf5;padding:1px 6px 0;">h</span></span>
      </div>
    </div>
  </div>

  <!-- trend graph -->
  <div style="position:absolute;top:120px;left:330px;">
    <svg width="880" height="560" viewBox="0 0 880 560" style="display:block;">
      <!-- left axis -->
      <rect x="62" y="8" width="9" height="42" fill="#e03a2a"></rect>
      <g font-family="Tahoma,Verdana,sans-serif" font-size="19" fill="#e8ecf5" text-anchor="end">
        <text x="58" y="20">600</text><text x="58" y="58">550</text><text x="58" y="96">500</text><text x="58" y="134">450</text><text x="58" y="172">400</text><text x="58" y="210">350</text><text x="58" y="248">300</text><text x="58" y="286">250</text><text x="58" y="324">200</text><text x="58" y="362">150</text><text x="58" y="400">100</text><text x="58" y="438">50</text><text x="58" y="476">0</text>
      </g>
      <g stroke="#e8ecf5" stroke-width="1">
        <line x1="66" y1="14" x2="76" y2="14"></line><line x1="66" y1="52" x2="76" y2="52"></line><line x1="66" y1="90" x2="76" y2="90"></line><line x1="66" y1="128" x2="76" y2="128"></line><line x1="66" y1="166" x2="76" y2="166"></line><line x1="66" y1="204" x2="76" y2="204"></line><line x1="66" y1="242" x2="76" y2="242"></line><line x1="66" y1="280" x2="76" y2="280"></line><line x1="66" y1="318" x2="76" y2="318"></line><line x1="66" y1="356" x2="76" y2="356"></line><line x1="66" y1="394" x2="76" y2="394"></line><line x1="66" y1="432" x2="76" y2="432"></line><line x1="66" y1="470" x2="76" y2="470"></line>
        <line x1="76" y1="8" x2="76" y2="470"></line>
      </g>
      <!-- plot area -->
      <rect x="76" y="14" width="724" height="456" fill="none" stroke="#5a6480" stroke-width="1"></rect>
      <g stroke="#333d5c" stroke-width="1">
        <line x1="257" y1="14" x2="257" y2="470"></line><line x1="438" y1="14" x2="438" y2="470"></line><line x1="619" y1="14" x2="619" y2="470"></line>
        <line x1="76" y1="128" x2="800" y2="128"></line><line x1="76" y1="242" x2="800" y2="242"></line><line x1="76" y1="356" x2="800" y2="356"></line>
      </g>
      <!-- zeroed curves: flat at 0 -->
      <line x1="76" y1="469" x2="800" y2="469" stroke="#39c98e" stroke-width="2"></line>
      <line x1="76" y1="468" x2="800" y2="468" stroke="#e03a2a" stroke-width="2"></line>
      <line x1="76" y1="467" x2="800" y2="467" stroke="#f2e42a" stroke-width="2"></line>
      <line x1="76" y1="470" x2="800" y2="470" stroke="#3fd4f0" stroke-width="2"></line>
      <!-- right axis -->
      <g stroke="#e8ecf5" stroke-width="1">
        <line x1="800" y1="8" x2="800" y2="470"></line>
        <line x1="800" y1="14" x2="810" y2="14"></line><line x1="800" y1="59.6" x2="810" y2="59.6"></line><line x1="800" y1="105.2" x2="810" y2="105.2"></line><line x1="800" y1="150.8" x2="810" y2="150.8"></line><line x1="800" y1="196.4" x2="810" y2="196.4"></line><line x1="800" y1="242" x2="810" y2="242"></line><line x1="800" y1="287.6" x2="810" y2="287.6"></line><line x1="800" y1="333.2" x2="810" y2="333.2"></line><line x1="800" y1="378.8" x2="810" y2="378.8"></line><line x1="800" y1="424.4" x2="810" y2="424.4"></line><line x1="800" y1="470" x2="810" y2="470"></line>
      </g>
      <g font-family="Tahoma,Verdana,sans-serif" font-size="19" fill="#e8ecf5">
        <text x="814" y="20">250</text><text x="814" y="66">225</text><text x="814" y="112">200</text><text x="814" y="157">175</text><text x="814" y="203">150</text><text x="814" y="248">125</text><text x="814" y="294">100</text><text x="814" y="340">75</text><text x="814" y="385">50</text><text x="814" y="431">25</text><text x="814" y="476">0</text>
      </g>
      <rect x="862" y="10" width="9" height="46" fill="#2ec25f"></rect>
      <rect x="862" y="58" width="9" height="46" fill="#f2e42a"></rect>
      <!-- x labels -->
      <g font-family="Tahoma,Verdana,sans-serif" font-size="19" fill="#e8ecf5" text-anchor="middle">
        <text x="86" y="498">0:00:00</text><text x="86" y="522">01-01-2024</text>
        <text x="257" y="498">0:00:00</text><text x="257" y="522">01-01-2024</text>
        <text x="438" y="498">0:00:00</text><text x="438" y="522">01-01-2024</text>
        <text x="619" y="498">0:00:00</text><text x="619" y="522">01-01-2024</text>
        <text x="790" y="498">0:00:00</text><text x="790" y="522">01-01-2024</text>
      </g>
    </svg>
    <div style="display:flex;justify-content:space-around;font-size:24px;margin-top:2px;">
      <div style="text-align:center;"><div style="color:#3fd4f0;">Toevoer actief</div><div style="color:#ff5a2a;margin-top:10px;">PCU - vermogen</div></div>
      <div style="text-align:center;"><div style="color:#39c98e;">PCU - temperatuur 1</div><div style="color:#f2e42a;margin-top:10px;">AIS - positie</div></div>
    </div>
  </div>

  <!-- AutoPro control -->
  <div style="position:absolute;top:132px;left:1268px;width:212px;border:2px solid #c8cede;background:rgba(10,14,30,.4);">
    <div style="border:1px solid #8a93ac;margin:6px;padding:18px 8px;text-align:center;font-size:25px;line-height:1.25;cursor:pointer;" style-hover="background:#1d2745;">AutoPro -<br>control</div>
    <div style="border:1px solid #8a93ac;margin:6px;padding:26px 8px;text-align:center;font-size:25px;cursor:pointer;" style-hover="background:#1d2745;">Uit</div>
  </div>

  <!-- PCU-vulpeil -->
  <div style="position:absolute;top:378px;right:150px;width:220px;text-align:center;font-size:24px;color:#1a1f2e;">
    <div style="background:linear-gradient(#f2f3f7,#d9dce6);border:1px solid #7c8299;padding:5px 4px;">PCU-vulpeil</div>
    <div style="background:linear-gradient(#e8eaf1,#c9cdda);border:1px solid #7c8299;border-top:none;padding:12px 4px;font-size:30px;">0 cm</div>
  </div>

  <!-- machine mimic -->
  <svg width="1160" height="540" viewBox="0 0 1160 540" style="position:absolute;left:600px;top:525px;">
    <defs>
      <linearGradient id="stl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe4ef"></stop><stop offset="1" stop-color="#9aa4bd"></stop></linearGradient>
      <linearGradient id="std" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aeb6cc"></stop><stop offset="1" stop-color="#77809b"></stop></linearGradient>
    </defs>
    <!-- infeed conveyor ramp -->
    <polygon points="60,512 90,464 560,240 590,240 590,288 130,512" fill="url(#stl)" stroke="#6a7390" stroke-width="1.5"></polygon>
    <polygon points="60,512 130,512 118,530 74,530" fill="url(#std)"></polygon>
    <rect x="300" y="390" width="16" height="130" fill="url(#std)"></rect>
    <rect x="560" y="270" width="16" height="250" fill="url(#std)"></rect>
    <circle cx="308" cy="524" r="9" fill="#dfe4ef"></circle><circle cx="568" cy="524" r="9" fill="#dfe4ef"></circle>
    <!-- metal detector flag -->
    <polygon points="360,328 410,304 428,334 378,358" fill="#c9cfe0" stroke="#6a7390"></polygon>
    <polygon points="392,288 404,282 412,306 400,312" fill="#d43a2a"></polygon>
    <!-- PCU hopper -->
    <polygon points="700,120 950,60 1050,60 1050,130 760,170" fill="url(#stl)" stroke="#6a7390" stroke-width="1.5"></polygon>
    <polygon points="640,190 700,120 760,170 700,230" fill="url(#std)"></polygon>
    <!-- PCU drum -->
    <rect x="810" y="130" width="230" height="140" rx="10" fill="url(#std)" stroke="#5d6580"></rect>
    <ellipse cx="925" cy="132" rx="115" ry="16" fill="#c5ccdd"></ellipse>
    <!-- water drops -->
    <g fill="#e8ecf5">
      <path d="M900 84 q7 -12 14 0 a7 7 0 1 1 -14 0"></path>
      <path d="M880 100 q7 -12 14 0 a7 7 0 1 1 -14 0"></path><path d="M920 100 q7 -12 14 0 a7 7 0 1 1 -14 0"></path>
      <path d="M860 116 q7 -12 14 0 a7 7 0 1 1 -14 0"></path><path d="M900 116 q7 -12 14 0 a7 7 0 1 1 -14 0"></path><path d="M940 116 q7 -12 14 0 a7 7 0 1 1 -14 0"></path>
    </g>
    <!-- extruder body -->
    <rect x="700" y="388" width="440" height="120" fill="#2456a8" stroke="#1a3c78"></rect>
    <polygon points="700,388 740,360 1140,360 1140,388" fill="#3a68b8"></polygon>
    <rect x="1040" y="410" width="120" height="60" fill="url(#std)"></rect>
    <text x="790" y="465" font-family="Tahoma,Verdana,sans-serif" font-size="52" font-weight="800" fill="#f2f4fa" letter-spacing="2">EREMA</text>
    <circle cx="1005" cy="448" r="24" fill="#f2f4fa"></circle><path d="M993 454 Q1005 436 1017 446" fill="none" stroke="#2456a8" stroke-width="5"></path>
    <rect x="660" y="500" width="500" height="20" fill="url(#stl)"></rect>
    <!-- drum-to-extruder connection -->
    <rect x="870" y="270" width="110" height="120" fill="url(#std)"></rect>
  </svg>

  <!-- mimic value boxes -->
  <sc-for list="{{ boxes }}" as="b" hint-placeholder-count="3">
    <div style="position:absolute;left:{{ b.x }}px;top:{{ b.y }}px;width:{{ b.w }}px;text-align:center;color:#1a1f2e;z-index:3;">
      <div style="background:linear-gradient(#f2f3f7,#d9dce6);border:1px solid #7c8299;padding:4px 2px;font-size:21px;">{{ b.label }}</div>
      <div style="background:linear-gradient(#e8eaf1,#c9cdda);border:1px solid #7c8299;border-top:none;padding:8px 2px;font-size:26px;">{{ b.value }}</div>
    </div>
  </sc-for>
  <!-- EX1-IZ1 with temp bar -->
  <div style="position:absolute;left:1610px;top:880px;width:190px;text-align:center;color:#1a1f2e;z-index:3;">
    <div style="background:linear-gradient(#f2f3f7,#d9dce6);border:1px solid #7c8299;padding:4px 2px;font-size:21px;">EX1-IZ1</div>
    <div style="background:linear-gradient(#e8eaf1,#c9cdda);border:1px solid #7c8299;border-top:none;padding:8px 2px 4px;font-size:26px;color:#5a6480;">0 °C
      <div style="height:7px;background:#aab2c8;margin-top:4px;"><div style="height:7px;width:0%;background:#3fd4f0;"></div></div>
    </div>
  </div>

  <!-- hamburger -->
  <div style="position:absolute;left:150px;bottom:60px;display:flex;flex-direction:column;gap:12px;cursor:pointer;">
    <div style="width:78px;height:11px;background:#e8a7b0;"></div>
    <div style="width:78px;height:11px;background:#e8a7b0;"></div>
    <div style="width:78px;height:11px;background:#e8a7b0;"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  renderVals() {
    const line = this.props.lineLabel ?? "LIJN 3C";
    return {
      line,
      boxes: [
        { x: 655, y: 785, w: 165, label: "BC1-toerental", value: "0 %" },
        { x: 1145, y: 700, w: 170, label: "EX1-vermogen", value: "0,0 kW" },
        { x: 1330, y: 700, w: 160, label: "AIS-positie", value: "0 %" },
        { x: 1505, y: 700, w: 165, label: "PCU-temp. 1", value: "0 °C" },
        { x: 1145, y: 790, w: 170, label: "EX1-toerental", value: "0 rpm" },
        { x: 1145, y: 925, w: 170, label: "EX1-belasting", value: "0 %" },
        { x: 1690, y: 505, w: 150, label: "PES-toerental", value: "0 %" },
        { x: 1770, y: 592, w: 145, label: "TEU-toerental", value: "0 %" },
        { x: 1700, y: 690, w: 175, label: "PCU-belasting", value: "0 %" },
        { x: 1700, y: 782, w: 175, label: "PCU-vermogen", value: "0,0 kW" },
      ],

  }

</script>
</body>
</html>
