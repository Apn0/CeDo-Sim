<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;padding:0;background:#05070f;} a{color:#7fb2e8;} a:hover{color:#a8ccf2;}</style>
</helmet>
<div style="width:1920px;height:1080px;position:relative;overflow:hidden;background:#080b16;font-family:Tahoma,Verdana,sans-serif;color:#eef1f8;" data-screen-label="SV Toevoer Trend">

  <!-- header -->
  <div style="position:absolute;top:26px;left:40px;display:flex;align-items:flex-start;gap:14px;">
    <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="#eef1f8" stroke-width="2.5"></circle><line x1="17" y1="17" x2="17" y2="8" stroke="#eef1f8" stroke-width="2.5"></line><line x1="17" y1="17" x2="23" y2="20" stroke="#eef1f8" stroke-width="2.5"></line></svg>
    <div style="font-size:28px;line-height:1.3;">00:00:00<br>01/01/2024</div>
  </div>
  <div style="position:absolute;top:30px;right:48px;font-size:34px;font-weight:600;">Peter 2</div>

  <!-- trend -->
  <div style="position:absolute;top:150px;left:70px;">
    <svg width="1500" height="720" viewBox="0 0 1500 720">
      <!-- legend swatches left -->
      <rect x="70" y="70" width="46" height="26" fill="#e0392a"></rect>
      <rect x="70" y="150" width="46" height="26" fill="#3fd4f0"></rect>
      <!-- left axis 0-400 -->
      <g font-family="Tahoma,Verdana,sans-serif" font-size="30" fill="#eef1f8" text-anchor="end">
        <text x="150" y="82">400</text><text x="150" y="222">300</text><text x="150" y="362">200</text><text x="150" y="502">100</text><text x="150" y="642">0</text>
      </g>
      <g stroke="#eef1f8" stroke-width="1.5">
        <line x1="160" y1="72" x2="174" y2="72"></line><line x1="160" y1="212" x2="174" y2="212"></line><line x1="160" y1="352" x2="174" y2="352"></line><line x1="160" y1="492" x2="174" y2="492"></line><line x1="160" y1="632" x2="174" y2="632"></line>
        <line x1="174" y1="60" x2="174" y2="632"></line>
        <line x1="174" y1="632" x2="1300" y2="632"></line>
        <line x1="1300" y1="60" x2="1300" y2="632"></line>
        <!-- right axis ticks 0-225 -->
        <line x1="1300" y1="72" x2="1314" y2="72"></line><line x1="1300" y1="134" x2="1314" y2="134"></line><line x1="1300" y1="196" x2="1314" y2="196"></line><line x1="1300" y1="258" x2="1314" y2="258"></line><line x1="1300" y1="320" x2="1314" y2="320"></line><line x1="1300" y1="382" x2="1314" y2="382"></line><line x1="1300" y1="444" x2="1314" y2="444"></line><line x1="1300" y1="506" x2="1314" y2="506"></line><line x1="1300" y1="570" x2="1314" y2="570"></line><line x1="1300" y1="632" x2="1314" y2="632"></line>
      </g>
      <!-- right axis labels 225..0 -->
      <g font-family="Tahoma,Verdana,sans-serif" font-size="30" fill="#eef1f8">
        <text x="1322" y="82">225</text><text x="1322" y="144">200</text><text x="1322" y="206">175</text><text x="1322" y="268">150</text><text x="1322" y="330">125</text><text x="1322" y="392">100</text><text x="1322" y="454">75</text><text x="1322" y="516">50</text><text x="1322" y="580">25</text><text x="1322" y="642">0</text>
      </g>
      <!-- legend swatches right -->
      <rect x="1440" y="60" width="46" height="26" fill="#2ec25f"></rect>
      <rect x="1440" y="122" width="46" height="26" fill="#f2e42a"></rect>
      <!-- zeroed flat curves at baseline -->
      <line x1="174" y1="631" x2="1300" y2="631" stroke="#e0392a" stroke-width="3"></line>
      <line x1="174" y1="630" x2="1300" y2="630" stroke="#3fd4f0" stroke-width="3"></line>
      <line x1="174" y1="629" x2="1300" y2="629" stroke="#2ec25f" stroke-width="3"></line>
      <line x1="174" y1="628" x2="1300" y2="628" stroke="#f2e42a" stroke-width="3"></line>
      <!-- x labels -->
      <g font-family="Tahoma,Verdana,sans-serif" font-size="30" fill="#eef1f8" text-anchor="middle">
        <text x="230" y="672">00:00:00</text><text x="230" y="706">01/01/2024</text>
        <text x="1250" y="672">00:00:00</text><text x="1250" y="706">01/01/2024</text>
      </g>
    </svg>
    <!-- legend labels -->
    <div style="display:flex;font-size:30px;margin-top:18px;padding:0 60px 0 420px;">
      <div style="flex:1;text-align:center;"><div style="color:#e0392a;">SV-vermogen (kW)</div><div style="color:#3fd4f0;margin-top:18px;">toevoer aan</div></div>
      <div style="flex:1;text-align:center;"><div style="color:#2ec25f;">SV-temperatuur (°C)</div><div style="color:#f2e42a;margin-top:18px;">intrekschuif (%)</div></div>
    </div>
  </div>

  <!-- bottom left button -->
  <div style="position:absolute;left:90px;bottom:90px;width:270px;border:2px solid #c8cede;padding:22px 8px;text-align:center;font-size:30px;line-height:1.25;cursor:pointer;background:rgba(12,18,38,.45);" style-hover="background:#1d2745;">toevoer<br>keuze</div>

  <!-- bottom-right mini mimic + value boxes -->
  <svg width="620" height="230" viewBox="0 0 620 230" style="position:absolute;right:120px;bottom:120px;">
    <defs><linearGradient id="stl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe4ef"></stop><stop offset="1" stop-color="#9aa4bd"></stop></linearGradient></defs>
    <polygon points="20,210 44,176 300,60 324,60 324,96 96,210" fill="url(#stl)" stroke="#6a7390" stroke-width="1.5"></polygon>
    <polygon points="150,120 170,112 178,132 158,140" fill="#d43a2a"></polygon>
    <rect x="330" y="70" width="270" height="120" fill="#2456a8" stroke="#1a3c78"></rect>
    <polygon points="330,70 356,52 600,52 600,70" fill="#3a68b8"></polygon>
  </svg>
  <div style="position:absolute;right:120px;bottom:70px;display:flex;gap:20px;color:#1a1f2e;">
    <div style="width:130px;text-align:center;"><div style="background:linear-gradient(#f2f3f7,#d9dce6);border:1px solid #7c8299;padding:4px 2px;font-size:20px;">SV-vermogen</div><div style="background:linear-gradient(#e8eaf1,#c9cdda);border:1px solid #7c8299;border-top:none;padding:8px 2px;font-size:26px;">0,0 kW</div></div>
    <div style="width:130px;text-align:center;"><div style="background:linear-gradient(#f2f3f7,#d9dce6);border:1px solid #7c8299;padding:4px 2px;font-size:20px;">intrekschuif</div><div style="background:linear-gradient(#e8eaf1,#c9cdda);border:1px solid #7c8299;border-top:none;padding:8px 2px;font-size:26px;">0 %</div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}"></script>
</body>
</html>
