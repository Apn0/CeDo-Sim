<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1120,&quot;height&quot;:720}}">
class Component extends DCLogic {
  renderVals() {
    // sawtooth green cycle + noisy red band
    let green = [], red = [];
    const baseY = 200, peakY = 120;
    for (let i = 0; i < 22; i++) {
      const x0 = i * 43;
      green.push(`${x0},${baseY}`, `${x0+18},${peakY}`, `${x0+20},${baseY}`, `${x0+41},${baseY}`);
    }
    for (let x = 0; x <= 940; x += 12) {
      red.push(`${x},${185 + Math.sin(x/30)*6 + (Math.random()*4-2) | 0}`);
    }
    return { greenLine: green.join(" "), redLine: red.join(" "), ctrls: ["⏪","⏸","▶","⏩","⏭"] };
  }
}
</script>
